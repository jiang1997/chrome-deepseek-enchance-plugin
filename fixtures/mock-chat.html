<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Enhancer mock chat page</title>
  <style>
    body { display: flex; margin: 0; font-family: sans-serif; }
    aside { width: 220px; background: #f3f4f6; padding: 12px; }
    main { flex: 1; padding: 24px; padding-bottom: 160px; }
    .msg { max-width: 720px; margin: 16px 0; line-height: 1.7; }
    .composer-wrap { position: fixed; left: 220px; right: 0; bottom: 0; padding: 16px 24px; background: #fff; border-top: 1px solid #e5e7eb; }
    #composer { width: min(720px, 90%); min-height: 56px; }
  </style>
</head>
<body>
  <aside>
    <div role="search"><input role="textbox" aria-label="Search" value="" placeholder="Search conversations" /></div>
    <nav><p>Chat history</p></nav>
  </aside>
  <main>
    <!--
      Mirrors chat.deepseek.com's message list. The real page uses a virtual list whose
      items carry data-virtual-list-item-key (sequential position) and semantic content
      classes. Role + ordinal resolution relies on those hooks only.
    -->
    <div class="ds-virtual-list-items" id="messages">
      <div class="_9663006" data-virtual-list-item-key="1">
        <div class="ds-message">
          <div class="fbb737a4"><div class="ds-collapsible-text"><div><span>What is a closure?</span></div></div></div>
        </div>
      </div>
      <div class="_4f9bf79 _43c05b5" data-virtual-list-item-key="2">
        <div class="ds-message">
          <div class="ds-markdown ds-assistant-message-main-content">
            <p class="ds-markdown-paragraph">A JavaScript closure keeps the lexical environment it could access when it was created. Even after the outer function returns, the inner function can still access variables from the outer scope.</p>
          </div>
        </div>
      </div>
      <div class="_9663006" data-virtual-list-item-key="3">
        <div class="ds-message">
          <div class="fbb737a4"><div class="ds-collapsible-text"><div><span>Show me an example.</span></div></div></div>
        </div>
      </div>
      <div class="_4f9bf79 _43c05b5" data-virtual-list-item-key="4">
        <div class="ds-message">
          <div class="ds-markdown ds-assistant-message-main-content">
            <pre><code>function outer() { const x = 1; return () =&gt; x; }</code></pre>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div class="composer-wrap">
    <!-- Scenario A: a textarea composer; to verify contenteditable, replace the element below with div[contenteditable] -->
    <textarea id="composer" aria-label="Send message" placeholder="Message DeepSeek"></textarea>
  </div>
</body>
</html>
