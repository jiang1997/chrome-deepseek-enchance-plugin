<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepSeek Enhancer mock chat page</title>
  <style>
    body { display: flex; margin: 0; font-family: sans-serif; }
    aside { width: 220px; background: #f3f4f6; padding: 12px; }
    main { flex: 1; padding: 24px; padding-bottom: 160px; }
    .msg { max-width: 720px; margin: 16px 0; line-height: 1.7; }
    .composer-wrap { position: fixed; left: 220px; right: 0; bottom: 0; padding: 16px 24px; background: #fff; border-top: 1px solid #e5e7eb; }
    #composer { width: min(720px, 90%); min-height: 56px; }
  </style>
</head>
<body>
  <aside>
    <div role="search"><input role="textbox" aria-label="Search" value="" placeholder="Search conversations" /></div>
    <nav><p>Chat history</p></nav>
  </aside>
  <main>
    <article class="msg" id="msg1">
      <h3>What is a closure?</h3>
      <p>A JavaScript closure keeps the lexical environment it could access when it was created. Even after the outer function returns, the inner function can still access variables from the outer scope.</p>
    </article>
    <article class="msg" id="msg2">
      <pre><code>function outer() { const x = 1; return () =&gt; x; }</code></pre>
    </article>
  </main>
  <div class="composer-wrap">
    <!-- Scenario A: a textarea composer; to verify contenteditable, replace the element below with div[contenteditable] -->
    <textarea id="composer" aria-label="Send message" placeholder="Type a message, press Enter to send"></textarea>
  </div>
</body>
</html>
