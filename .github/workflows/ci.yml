name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build & browser check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check production extension in Chromium
        id: tree-check
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p artifacts/tree-check
          npm run check:tree 2>&1 | tee artifacts/tree-check/run.log

      - name: Upload browser check diagnostics
        if: ${{ failure() && steps.tree-check.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: tree-check-diagnostics
          path: artifacts/tree-check/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
